<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Master</title>
  <style>
    :root {
      color-scheme: dark;
      --cyan: #35f2ff;
      --violet: #9c6cff;
      --panel: rgba(10, 17, 30, 0.88);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f5fbff;
      background:
        radial-gradient(circle at 50% 20%, rgba(53, 242, 255, 0.12), transparent 32rem),
        linear-gradient(145deg, #02050b 0%, #080d19 52%, #03050a 100%);
      font-family: "Arial Black", "Trebuchet MS", system-ui, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(53, 242, 255, 0.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(53, 242, 255, 0.22) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, transparent, black 35%, transparent);
    }

    main {
      position: relative;
      width: min(90vw, 760px);
      padding: clamp(2.2rem, 7vw, 5rem);
      text-align: center;
      border: 1px solid rgba(53, 242, 255, 0.35);
      border-radius: 24px;
      background: var(--panel);
      box-shadow:
        0 0 60px rgba(53, 242, 255, 0.12),
        inset 0 0 35px rgba(156, 108, 255, 0.06);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 0.35em;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(3.4rem, 12vw, 7.5rem);
      font-style: italic;
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: 0.055em;
      text-transform: uppercase;
      color: transparent;
      -webkit-text-stroke: 2px var(--cyan);
      text-shadow:
        4px 4px 0 var(--violet),
        0 0 18px rgba(53, 242, 255, 0.7),
        0 0 45px rgba(156, 108, 255, 0.45);
    }

    .tagline {
      margin: 0 0 2.4rem;
      color: #9fb3c8;
      font-family: ui-monospace, "Courier New", monospace;
      font-size: clamp(0.78rem, 2vw, 1rem);
      letter-spacing: 0.34em;
      text-transform: uppercase;
    }

    a {
      display: inline-block;
      padding: 1rem 1.45rem;
      border: 1px solid var(--cyan);
      border-radius: 10px;
      color: #061016;
      background: var(--cyan);
      box-shadow: 0 0 22px rgba(53, 242, 255, 0.28);
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    a:hover,
    a:focus-visible {
      transform: translateY(-3px) scale(1.02);
      background: #a6faff;
      box-shadow: 0 0 34px rgba(53, 242, 255, 0.6);
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Quiz<br>Master</h1>
    <p class="tagline">Select a challenge</p>
    <a href="matching_quiz_senators_and_representatives.html">
      Matching Game - US Congress
    </a>
  </main>
</body>
</html>
